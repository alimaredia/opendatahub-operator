rule_files:
  - sparkoperator-alerting.rules.yaml

evaluation_interval: 1m

tests:
  # All burn rates are zero — no alert should fire
  - interval: 1m
    input_series:
      - series: probe_success:burnrate5m{instance="spark-operator-controller-manager"}
        values: "0x60"
      - series: probe_success:burnrate1h{instance="spark-operator-controller-manager"}
        values: "0x60"
      - series: probe_success:burnrate30m{instance="spark-operator-controller-manager"}
        values: "0x60"
      - series: probe_success:burnrate6h{instance="spark-operator-controller-manager"}
        values: "0x60"
      - series: probe_success:burnrate2h{instance="spark-operator-controller-manager"}
        values: "0x60"
      - series: probe_success:burnrate1d{instance="spark-operator-controller-manager"}
        values: "0x60"
    alert_rule_test:
      - eval_time: 1h
        alertname: Spark Operator Probe Success Burn Rate
        exp_alerts: []

  # Fast burn (5m + 1h) — should fire at 2m with severity critical
  - interval: 1m
    input_series:
      - series: probe_success:burnrate5m{instance="spark-operator-controller-manager"}
        values: "1+1x60"
      - series: probe_success:burnrate1h{instance="spark-operator-controller-manager"}
        values: "1+1x60"
    alert_rule_test:
      - eval_time: 2m
        alertname: Spark Operator Probe Success Burn Rate
        exp_alerts:
          - exp_labels:
              alertname: Spark Operator Probe Success Burn Rate
              instance: "spark-operator-controller-manager"
              severity: critical
            exp_annotations:
              summary: "Spark Operator Probe Success Burn Rate"
              message: "High error budget burn for spark-operator-controller-manager (current value: 3 )."

  # Medium burn (30m + 6h) — should fire at 15m with severity critical
  - interval: 1m
    input_series:
      - series: probe_success:burnrate30m{instance="spark-operator-controller-manager"}
        values: "1+1x60"
      - series: probe_success:burnrate6h{instance="spark-operator-controller-manager"}
        values: "1+1x60"
    alert_rule_test:
      - eval_time: 15m
        alertname: Spark Operator Probe Success Burn Rate
        exp_alerts:
          - exp_labels:
              alertname: Spark Operator Probe Success Burn Rate
              instance: "spark-operator-controller-manager"
              severity: critical
            exp_annotations:
              summary: "Spark Operator Probe Success Burn Rate"
              message: "High error budget burn for spark-operator-controller-manager (current value: 16 )."

  # Slow burn (2h + 1d) — should fire at 1h with severity warning
  - interval: 1m
    input_series:
      - series: probe_success:burnrate2h{instance="spark-operator-controller-manager"}
        values: "1+1x60"
      - series: probe_success:burnrate1d{instance="spark-operator-controller-manager"}
        values: "1+1x60"
    alert_rule_test:
      - eval_time: 1h
        alertname: Spark Operator Probe Success Burn Rate
        exp_alerts:
          - exp_labels:
              alertname: Spark Operator Probe Success Burn Rate
              instance: "spark-operator-controller-manager"
              severity: warning
            exp_annotations:
              summary: "Spark Operator Probe Success Burn Rate"
              message: "High error budget burn for spark-operator-controller-manager (current value: 61 )."
